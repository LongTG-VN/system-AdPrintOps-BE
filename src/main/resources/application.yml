server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: system-adprintops-be

  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:200MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:200MB}

  datasource:
    url: ${DB_URL:jdbc:h2:mem:adprintops_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: false

  mail:
    host: smtp.gmail.com
    port: 465
    username: ${GMAIL_USERNAME:gialong.game@gmail.com}
    password: ${GMAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# Custom Application JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMw==}
    expiration-ms: 86400000 # 24 hours in milliseconds
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  pricing:
    allow-fallback: ${PRICING_ALLOW_FALLBACK:true}
  resend:
    api-key: ${RESEND_API_KEY:}
    from: ${RESEND_FROM:AdPrintOps <onboarding@resend.dev>}
  feedback:
    default-recipient: ${FEEDBACK_DEFAULT_RECIPIENT:longtg.ce191181@gmail.com}
  storage:
    design-files-path: ${DESIGN_FILES_PATH:D:/Design}
